# Cambridge Mathematical Tripos Part IA - syllabus register (coverage.yaml)
#
# SOURCE: Schedules of Lecture Courses and Form of Examinations for the Mathematical Tripos 2026-27
# (Revised 19 August 2026), Part IA, printed pp.8-12 (PDF pp.10-14). See references/source-register.md.
#
# FORMAT (a deliberately small YAML subset so it can be parsed with the Python standard library):
#   - a list of records; each record starts with "- id: ..." and continues with "  key: value" lines;
#   - every value is a JSON scalar or JSON array (double-quoted strings, [..] arrays, null, numbers).
#
# FIELDS
#   id            stable identifier, IA-<course code>-NNN (topic items); IA-<code>-Nnn (course notes)
#   course        Cambridge course name
#   heading       the sub-heading under which the Schedules list the item
#   source        the syllabus statement, text exactly as in the Schedules after the normalisation listed
#                 in references/source-register.md (the lecture-count marker [n] is stored separately)
#   lectures_in_block  lectures the Schedules assign to the whole source paragraph [n]; NOT per item
#   block         identifier of the source paragraph (items sharing a block share its lecture count)
#   location      source document and page
#   status        examinable | starred-not-examinable | course-note | ancillary-non-examinable
#   starred_spans (optional) spans inside an otherwise examinable item that the Schedules star
#   prerequisites ids of items whose content this item builds on (see prereq_basis)
#   prereq_basis  cambridge-stated (the Schedules or Guide say so) | librarian-judgement (Claude's
#                 reading of the mathematics; for the curriculum director to confirm or amend)
#   readings      reading-map identifiers (curriculum/reading-map.md), one per Schedules sub-heading
#
# Mastery and coverage STATE is deliberately NOT stored here; it lives in progress/mastery.yaml.

