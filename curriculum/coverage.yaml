# Cambridge Mathematical Tripos Part IA - syllabus register (coverage.yaml)
#
# SOURCE: Schedules of Lecture Courses and Form of Examinations for the Mathematical Tripos 2026-27
# (Revised 19 August 2026), Part IA (SRC-01 in references/source-register.md).
#
# COPYRIGHT-SENSITIVE REPRESENTATION. This public file does NOT reproduce the Cambridge syllabus text. Each item has an
# original SUMMARY written by the curriculum librarian, an exact LOCATOR (document, edition, printed and PDF page, source
# heading, paragraph and position in it) and a FINGERPRINT (length and SHA-256 of the normalised source statement), so the
# item can be audited against the original Schedules on a machine that holds a local copy (scripts/validate.py
# --schedules-text). The Cambridge PDF stays outside the repository. A passing fingerprint audit shows only that the source
# passage is the one the item was built from; it does NOT show that the summary is a faithful rendering. Summary fidelity is
# an academic judgement for the curriculum director and the independent reviewer. Where the Schedules give only a bare topic
# name, the summary necessarily repeats it (validate.py keeps an explicit list of those items).
#
# FORMAT (a deliberately small YAML subset, parsed with the Python standard library):
#   - a list of records; each record starts with "- id: ..." and continues with "  key: value" lines;
#   - every value is a JSON scalar, array or object (double-quoted strings, [..], {..}, null, numbers);
#   - a key may appear only once in a record (the validator rejects duplicates).
#
# FIELDS
#   id             stable identifier, IA-<course code>-NNN (topics) or IA-<code>-Nnn (course notes). Never renumbered.
#   course         Cambridge course name
#   heading        the exact Cambridge sub-heading under which the Schedules place the item (a short label, kept for audit)
#   summary        original summary (see above); scope qualifiers in the source are preserved in the wording and in `qualifiers`
#   summary_status librarian-draft | reviewed   ("reviewed" is set only after the director or independent reviewer has compared
#                  the summary with the source; none has been so far)
#   qualifiers     scope tags derived from the source wording: statement-only, informal-treatment, informal-proof,
#                  proof-sketch, proof-given, brief, revision
#   starred_part   (optional) description of a starred (lectured, not examinable) part of an otherwise examinable item
#   source_doc     SRC-01
#   printed_page / pdf_page   page of the Schedules 2026-27 booklet
#   block          source paragraph (one paragraph carries one lecture count)
#   block_item     "k of n": this item is the k-th of the n items taken from that paragraph
#   lectures_in_block   lectures the Schedules assign to the whole paragraph (shared by its items; not a per-item figure);
#                  null for every item of a paragraph that has no count of its own
#   status         examinable | starred-not-examinable | course-note | ancillary-non-examinable
#   builds_on      typed links to earlier items, each ["<id>", "<type>", "<provenance>", "<approval>"]:
#                    type        required     mathematically necessary for the intended treatment
#                                assumed      prior knowledge the programme takes for granted; it can be established by the
#                                             diagnostic assessment or earlier study, so it implies no ordering within the programme
#                                recommended  helpful preparation, not strictly necessary
#                                connection   related material; implies NO ordering constraint
#                    provenance  cambridge-stated          Cambridge states this item-to-item link itself
#                                cambridge-course-level    Cambridge states a dependence or link between the two COURSES (Schedules or
#                                                          Guide); which items it joins is the librarian's mapping
#                                inferred-from-cambridge   follows from Cambridge's wording (for example the same topic in two courses)
#                                                          but Cambridge states no dependence
#                                librarian-judgement       the librarian's reading of the mathematics
#                    approval    provisional | director-approved   (separate from provenance: where a link comes from is not
#                                whether the director has accepted it)
#                  A prerequisite may be satisfied by prior study; it never means "mastery must be recorded first".
#   readings       reading-map identifiers (curriculum/reading-map.md)
#   fingerprint    {"chars": N, "sha256": "..."} of the normalised source statement; N is at least 1; see scripts/validate.py for the
#                  normalisation
#
# Mastery and coverage STATE is deliberately NOT stored here; it lives in progress/mastery.yaml.

