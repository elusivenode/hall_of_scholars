- id: "IA-CP-002"
  course: "Computational Projects (non-examinable in Part IA)"
  heading: "Projects and manual"
  source: "The projects that need to be completed for credit are published by the Faculty in a manual usually at the end of July or the beginning of August at the end of the Part IA year. The manual contains details of the projects and information about course administration. The manual is available on the Faculty website at https://www.maths.cam.ac.uk/undergrad/catam/. Full credit may be obtained from the submission of the two core projects and a further two additional projects. Once the manual is available, these projects may be undertaken at any time up to the submission deadlines, which are near the start of the Full Lent Term in the Part IB year for the two core projects, and near the start of the Full Easter Term in the Part IB year for the two additional projects. A list of suitable books can be found in the manual."
  lectures_in_block: null
