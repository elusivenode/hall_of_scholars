# Mastery and coverage state per syllabus item (progress/mastery.yaml)
#
# Same restricted YAML subset as curriculum/coverage.yaml.
#
# FIELDS
#   coverage   not-started | in-progress | covered   ("covered" means taught or read; it is NOT a mastery claim)
#   mastery    unassessed | familiarity | understanding | independent-competence | durable-mastery
#   hints      for the current evidence: none | minor | substantial | unknown   (null while unassessed)
#              "unknown" is permitted where hint history is genuinely unavailable. The validator never converts unknown
#              hint history into a level; the assessor decides what, if anything, the evidence supports.
#   evidence   repository paths of the student's actual work (non-empty once mastery is not "unassessed")
#   authorised_by / authorised_date   the assessor ("ChatGPT-assessor") and DD/MM/YYYY
#   history    every authorised decision, oldest first: {"date","level","hints","evidence","authorised_by"}.
#              The top-level mastery, hints, evidence and authorisation always mirror the LAST history entry.
#   notes      free text
#
# RULES (governance/assessment-standard.md)
#   - Only ChatGPT acting as assessor authorises a change. Claude Code records authorised changes and never infers them.
#   - independent-competence and durable-mastery require hints "none".
#   - durable-mastery requires an earlier independent-competence entry at least 28 days before, resting on DIFFERENT
#     evidence. Time elapsed is necessary but not sufficient: the assessor must judge the later work to be independent
#     reasoning on genuinely new material (preferably in a different context). That judgement cannot be validated here.
#   - The validator checks that records exist and are well formed and that the rules above hold structurally. It cannot
#     check mathematical correctness or authenticate an assessment decision.
#
# Every item below starts at "unassessed": nothing has been assessed.

